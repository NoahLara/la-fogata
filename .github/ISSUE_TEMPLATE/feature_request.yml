name: Feature request
description: Suggest an idea for La Fogata
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        La Fogata is not a chat. Ideas that add direct messages, profiles, likes or streaks are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or problem does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy impact
      description: Does this touch personal data, moderation, or anonymity?
    validations:
      required: false
