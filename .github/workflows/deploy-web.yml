name: Deploy web

# The web (Next.js on Cloudflare Workers through @opennextjs/cloudflare). Like the realtime deploy, it runs after CI
# has passed on master, or by hand, and skips itself where it cannot deploy: without the Cloudflare credentials, or
# without the realtime host the page needs to find its campfires.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: deploy web
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Where the browser finds the realtime Worker (host only, no scheme), as a repository variable. It is baked
      # into the page when it is built, so it has to be known before the web is deployed.
      NEXT_PUBLIC_REALTIME_HOST: ${{ vars.REALTIME_HOST }}
    steps:
      - name: Check for Cloudflare credentials and the realtime host
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare credentials here: nothing to deploy."
          elif [ -z "$NEXT_PUBLIC_REALTIME_HOST" ]; then
            echo "The repository variable REALTIME_HOST is not set (see docs/DEPLOY.md): the web is not deployed."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.enabled == 'true'

      - name: Build and deploy the web
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm --filter @fogata/web run deploy
